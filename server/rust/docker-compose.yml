services:
  redis:
    image: redis:alpine
    container_name: roomer-rust-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  node1:
    build:
      context: ../..
      dockerfile: server/rust/Dockerfile
      args:
        EXAMPLE: server_with_redis
        FEATURES: redis-adapter
    container_name: roomer-rust-node1
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  node2:
    build:
      context: ../..
      dockerfile: server/rust/Dockerfile
      args:
        EXAMPLE: server_with_redis
        FEATURES: redis-adapter
    container_name: roomer-rust-node2
    environment:
      - PORT=8081
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
