[package]
name = "roomer"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["Jon Cody"]
description = "High-performance, room-based WebSocket framework with binary framing and multi-node clustering"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joncody/roomer"
keywords = ["websocket", "realtime", "axum", "tokio", "redis"]
categories = ["network-programming", "web-programming::websocket", "asynchronous"]

[dependencies]
# Async Runtime & Web Framework (Axum 0.8.9 + Tower-HTTP 0.6)
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Zero-Copy Byte Manipulation & Data Structures
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.15", features = ["v4"] }
dashmap = "6.1"
async-trait = "0.1"
thiserror = "2.0"
# Structured Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Multi-Node Clustering (Optional)
redis = { version = "0.27", features = ["tokio-comp", "aio"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.6"
tokio-tungstenite = "0.26"

[features]
default = []
redis-adapter = ["dep:redis"]

[[bench]]
name = "benchmarks"
harness = false

# We keep this explicit declaration because it requires a specific feature flag.
# Cargo will automatically discover `examples/server.rs` without needing a block.
[[example]]
name = "server_with_redis"
path = "examples/server_with_redis.rs"
required-features = ["redis-adapter"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
