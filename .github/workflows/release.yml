name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  pre-release-check:
    name: Pre-Release Verification & Dry Runs
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go/go.sum

      - name: Verify Go Tests
        working-directory: server/go
        env:
          REDIS_ADDR: localhost:6379
        run: go test -v -race ./...

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/rust

      - name: Verify Rust Tests & Cargo Publish Dry Run
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo test --manifest-path server/rust/Cargo.toml --all-targets --features redis-adapter
          cargo publish --manifest-path server/rust/Cargo.toml --dry-run

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/node/package-lock.json

      - name: Verify Node.js Tests & npm Dry Run
        working-directory: server/node
        env:
          REDIS_ADDR: localhost:6379
        run: |
          cp ../../LICENSE . 2>/dev/null || true
          npm ci
          npm test
          npm publish --dry-run

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python Tests, Build & Twine Check
        working-directory: client/python
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev]"
          pytest -v
          python -m build
          twine check dist/*

  publish-crates:
    name: Publish to Crates.io (Rust)
    needs: pre-release-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --manifest-path server/rust/Cargo.toml --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm (Node.js)
    needs: pre-release-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm with Provenance
        working-directory: server/node
        run: |
          cp ../../LICENSE . 2>/dev/null || true
          npm ci
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI (Python)
    needs: pre-release-check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/roomer-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Distribution Packages
        working-directory: client/python
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: client/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [publish-crates, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
