name: Go CI

on:
  push:
    branches: [main]
    paths:
      - 'server/go/**'
      - '.github/workflows/go.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/go/**'
      - '.github/workflows/go.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: server/go

jobs:
  lint:
    name: Go Format & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go/go.sum

      - name: Check Formatting
        run: |
          DIFF=$(gofmt -s -d .)
          if [ -n "$DIFF" ]; then
            echo "gofmt found unformatted files:"
            echo "$DIFF"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

  test-linux:
    name: Go Test & Integration (Linux + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go/go.sum

      - name: Run Tests with Race Detector
        env:
          REDIS_ADDR: localhost:6379
        run: go test -v -race ./...

  test-matrix:
    name: Go Cross-Platform Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go/go.sum

      - name: Run Unit Tests
        run: go test -v ./...
