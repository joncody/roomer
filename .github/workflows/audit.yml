name: Security & Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday

jobs:
  audit:
    name: Cargo Audit & Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: server/rust/Cargo.toml
