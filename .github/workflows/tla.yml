name: Formal Verification (TLA+)

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - '.github/workflows/tla.yml'
  pull_request:
    branches: [main]
    paths:
      - 'spec/**'
      - '.github/workflows/tla.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tla-check:
    name: TLC Model Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache TLA+ Tools
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: tla2tools.jar
          key: tla2tools-latest

      - name: Download tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: curl -fSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Verify Formal Invariants (spec/roomer.tla)
        run: java -cp tla2tools.jar tlc2.TLC -config spec/roomer.cfg spec/roomer.tla
