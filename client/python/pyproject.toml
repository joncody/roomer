[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roomer-client"
version = "1.0.1"
description = "High-performance, room-based WebSocket client for Roomer with binary framing and presence synchronization"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jon Cody" }
]
requires-python = ">=3.10"
keywords = [
    "websocket",
    "realtime",
    "rooms",
    "binary",
    "asyncio",
    "clustering"
]
dependencies = [
    "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]

[tool.hatch.build.targets.wheel]
include = [
    "roomer.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "roomer.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
